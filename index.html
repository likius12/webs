<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BETH</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #050002;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script>
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W, H, CX, CY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
  }
  resize();
  window.addEventListener('resize', resize);

  const SCALE = 100;

  // --- Heart parametric function ---
  function heart(u) {
    const x = 1.6 * Math.pow(Math.sin(u), 3);
    const y = 1.3 * Math.cos(u) - 0.5 * Math.cos(2 * u)
            - 0.2 * Math.cos(3 * u) - 0.1 * Math.cos(4 * u);
    return [x, y];
  }

  // --- Generate 3D point cloud ---
  const N = 2000;
  const pts = [];

  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 * Math.PI;
    const [hx, hy] = heart(u);
    const rad = Math.sqrt(Math.random());       // sqrt → volume fill
    const x = hx * rad;
    const y = hy * rad;
    const z = 1.1 * (1 - rad) * (Math.random() * 2 - 1);  // random.uniform(-1, 1)

    pts.push({ x, y, z });
  }

  // --- Color gradient based on radial factor f ---
  function getColor(f) {
    f = Math.max(0, Math.min(1, f));

    const r1 = 81,  g1 = 70,  b1 = 0;
    const r2 = 255, g2 = 30,  b2 = 50;

    const r = Math.round(r1 + (r2 - r1) * f);
    const g = Math.round(g1 + (g2 - g1) * f);
    const b = Math.round(b1 + (b2 - b1) * f);

    return `rgb(${r}, ${g}, ${b})`;
  }

  // --- Animation ---
  let angle = 0;

  function rotateY(p, a) {
    const cos = Math.cos(a), sin = Math.sin(a);
    return {
      x: p.x * cos - p.z * sin,
      y: p.y,
      z: p.x * sin + p.z * cos
    };
  }

  function render() {
    ctx.fillStyle = '#050002';
    ctx.fillRect(0, 0, W, H);

    angle += 0.008;

    // Perspective factor like the python: scale = SCALE
    const projected = pts.map(p => {
      const r = rotateY(p, angle);
      const zDepth = r.z + 2.5;                  // push away from camera
      const k = 2.5 / zDepth;                    // perspective scale

      return {
        x: CX + r.x * SCALE * k * 1.8,
        y: CY - r.y * SCALE * k * 1.8,
        size: k * 1.4,
        depth: zDepth,
        // f based on how "solid" the point is toward center of heart
        f: 1 - Math.hypot(r.x, r.y) / 1.7
      };
    }).sort((a, b) => b.depth - a.depth);

    ctx.shadowColor = 'rgba(255, 40, 60, 0.85)';
    ctx.shadowBlur = 5;

    for (const p of projected) {
      const alpha = Math.min(1, Math.max(0.2, 1.5 - p.depth / 3));
      ctx.fillStyle = getColor(p.f);
      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
